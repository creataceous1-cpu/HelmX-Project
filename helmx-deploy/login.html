<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HelmX — Unit Authentication</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-stone-50 text-gray-900 min-h-screen flex items-center justify-center p-4 font-sans">
    <div class="max-w-md w-full bg-white rounded-2xl border border-gray-200 shadow-lg p-8">
        <div class="flex items-center space-x-3 mb-6">
            <div class="w-10 h-10 rounded-lg bg-black flex items-center justify-center text-yellow-400 font-black text-lg">HX</div>
            <div>
                <h1 class="text-xl font-extrabold tracking-tight text-gray-950">HELMX TELEMETRY LOGIN</h1>
                <p class="text-xs text-gray-500 font-mono">ATEX SECURE UNIT AUTHENTICATION</p>
            </div>
        </div>

        <form id="helmet-login-form" class="space-y-4">
            <div>
                <label class="block text-xs font-bold uppercase text-gray-600 mb-1">Unique Helmet ID</label>
                <input type="text" id="login-unit-id" placeholder="e.g., HX-8492" required
                    class="w-full px-3.5 py-2.5 rounded-lg border border-gray-300 text-sm font-mono focus:ring-2 focus:ring-amber-500 focus:border-amber-500">
            </div>
            <div>
                <label class="block text-xs font-bold uppercase text-gray-600 mb-1">Unit Access Password</label>
                <input type="password" id="login-password" placeholder="••••••••" required
                    class="w-full px-3.5 py-2.5 rounded-lg border border-gray-300 text-sm font-mono focus:ring-2 focus:ring-amber-500 focus:border-amber-500">
            </div>

            <div id="login-error" class="hidden text-xs font-semibold text-red-600 bg-red-50 p-2.5 rounded-lg border border-red-200">
                Invalid Helmet ID or Password. Access Denied.
            </div>

            <button type="submit" class="w-full bg-black hover:bg-gray-900 text-white font-bold py-3 rounded-lg text-sm transition shadow">
                Authenticate & Launch Console →
            </button>
        </form>

        <div class="mt-6 pt-4 border-t border-gray-100 text-xs text-gray-500 space-y-1 font-mono">
            <p class="font-bold text-gray-700">Pre-Registered Demo Units:</p>
            <p>• ID: <span class="text-black font-bold">HX-8492</span> | Pass: <span class="text-black font-bold">mine123</span></p>
            <p>• ID: <span class="text-black font-bold">HX-8493</span> | Pass: <span class="text-black font-bold">shaft4b</span></p>
            <p class="text-[11px] text-amber-700 pt-1">*Or purchase a new helmet in the store to generate a fresh ID & password.</p>
        </div>

        <div class="mt-4 text-center">
            <a href="index.html" class="text-xs font-semibold text-gray-600 hover:text-black">← Back to Store</a>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
